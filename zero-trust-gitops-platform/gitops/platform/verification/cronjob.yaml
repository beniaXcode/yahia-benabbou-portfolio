# Continuous verification (BRIEF §6 Phase 6): admission-time verification
# (policies/supply-chain/verify-*.yaml) only ever checks an image once, at
# the moment it's first admitted. This re-checks every currently-running
# image's actual digest on a schedule, so a signature or attestation that
# becomes invalid later (a revoked Rekor entry, a compromised registry
# serving a different digest under the same tag before a hard restart)
# doesn't just sit there unnoticed between deployments.
#
# Both containers use the same kubectl-capable image (see
# verify-script-configmap.yaml for why cosign's own image can't play this
# role) — the initContainer fetches and checksum-verifies a real cosign
# release binary onto a shared emptyDir once per run; the main container
# uses it. Re-downloading ~130MB every run is a known inefficiency worth
# revisiting with a purpose-built image once this repo's build environment
# actually has Docker to build one with — not a correctness problem, since
# every download is still checksum-verified before anything trusts it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: continuous-verify
  namespace: platform-verification
  labels:
    app.kubernetes.io/name: platform-verification
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: platform-verification
            app.kubernetes.io/managed-by: argocd
        spec:
          serviceAccountName: continuous-verify
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: shared
              emptyDir: {}
            - name: results
              emptyDir: {}
            - name: script
              configMap:
                name: continuous-verify-script
                defaultMode: 0555
          initContainers:
            - name: fetch-cosign
              image: docker.io/bitnami/kubectl@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492
              command: ["/bin/sh", "/scripts/fetch-cosign.sh"]
              volumeMounts:
                - name: shared
                  mountPath: /shared
                - name: script
                  mountPath: /scripts
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          containers:
            - name: verify
              image: docker.io/bitnami/kubectl@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492
              command: ["/bin/sh", "/scripts/verify.sh"]
              volumeMounts:
                - name: shared
                  mountPath: /shared
                - name: results
                  mountPath: /results
                - name: script
                  mountPath: /scripts
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
