# Synced by gitops/platform/external-secrets/application.yaml's third
# source (a directory source pointed at this subdirectory specifically, not
# at external-secrets/ itself — that would also try to apply application.yaml
# and values.yaml, neither of which belongs on the target cluster).
#
# Two ClusterSecretStores, not one: "aws-secrets-manager" is the real
# production backend BRIEF.md asks for (Secrets Manager via Pod Identity —
# no static AWS credential anywhere in this object, C2/C7). "local-demo" is
# the documented substitute for `make demo`'s kind cluster, which has no AWS
# account behind it at all: it backs onto a plain in-cluster Kubernetes
# Secret instead, so the same ExternalSecret contract (gitops/apps/demo-api/
# base/externalsecret.yaml) round-trips identically in both places without
# demo-api's own manifests ever knowing which store answered it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # matches infra/terraform/envs/dev's region — see docs/versions.md
      auth:
        # No static keys (C2): external-secrets' own pod uses its EKS Pod
        # Identity association (see infra/terraform/modules/pod-identity;
        # a real deployment binds this operator's ServiceAccount to a role
        # scoped to secretsmanager:GetSecretValue on this project's own
        # secret ARNs only) to assume its permissions at call time.
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-demo
spec:
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
