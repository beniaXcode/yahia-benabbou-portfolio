apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.1  # app v1.19.1 — see docs/versions.md
      helm:
        valueFiles:
          - $values/zero-trust-gitops-platform/gitops/platform/kyverno/values.yaml
    - repoURL: https://github.com/beniaXcode/yahia-benabbou-portfolio.git
      targetRevision: main
      ref: values
    # C8: the same policies/ this repo's CI shift-left step (ci.yml) runs
    # against `kustomize build` output are the ones actually enforced at
    # admission — one source of truth. This path (not plain
    # zero-trust-gitops-platform/policies) is the "local signing fidelity"
    # fallback BRIEF.md's §4 anticipates: this specific deployment targets
    # the offline kind demo, which cannot reach Fulcio, so its three
    # verifyImages policies are patched to a local ephemeral-key attestor
    # instead of Sigstore keyless — see that overlay's own comments for the
    # full reasoning, and docs/fidelity.md for which path is active. A real
    # deployment with a Fulcio-reachable cluster restores this to plain
    # `path: zero-trust-gitops-platform/policies` (still a Kustomize root,
    # via that directory's own kustomization.yaml — Argo CD detects it
    # automatically, no `directory:` field needed either way).
    - repoURL: https://github.com/beniaXcode/yahia-benabbou-portfolio.git
      targetRevision: main
      path: zero-trust-gitops-platform/gitops/platform/kyverno/local-key-attestor
    # Points at manifests/ specifically, not this directory — this
    # directory also holds application.yaml and values.yaml, neither of
    # which is meant to be applied to the target cluster as-is.
    - repoURL: https://github.com/beniaXcode/yahia-benabbou-portfolio.git
      targetRevision: main
      path: zero-trust-gitops-platform/gitops/platform/kyverno/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # kyverno's CRDs exceed kubectl's last-applied-configuration annotation limit
