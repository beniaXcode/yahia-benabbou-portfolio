apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server
      chart: metrics-server
      targetRevision: 3.13.1  # app v0.8.1 — see docs/versions.md
      helm:
        valueFiles:
          - $values/zero-trust-gitops-platform/gitops/platform/metrics-server/values.yaml
    - repoURL: https://github.com/beniaXcode/yahia-benabbou-portfolio.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
