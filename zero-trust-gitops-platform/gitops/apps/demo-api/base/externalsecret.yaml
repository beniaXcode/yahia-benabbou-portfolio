# References the "local-demo" ClusterSecretStore by default (see
# gitops/platform/external-secrets/manifests/cluster-secret-store.yaml) —
# what `make demo`'s kind cluster, which has no AWS account behind it,
# actually backs onto. The prod overlay patches secretStoreRef.name to
# "aws-secrets-manager" to show the real production backend selection
# without demo-api's own Deployment ever changing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-api
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-demo
  target:
    name: demo-api-secret
    creationPolicy: Owner
  data:
    - secretKey: DEMO_SECRET
      remoteRef:
        # "local-demo"'s kubernetes provider resolves this key as a literal
        # Secret *object name* in the external-secrets namespace — unlike
        # AWS Secrets Manager, plain Kubernetes object names can't contain
        # "/", so this can't share a value with the AWS-path-style key the
        # prod overlay patches in below. demo/up.sh seeds a Secret with
        # exactly this name so the local-demo backend has something to
        # answer with.
        key: demo-api-demo-secret
