apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ownership-labels
  annotations:
    policies.kyverno.io/title: Require Ownership Labels
    policies.kyverno.io/category: Governance
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods must carry app.kubernetes.io/name and app.kubernetes.io/managed-by
      labels.
    nearvic.io/rationale: >-
      Policy Reporter's cluster-wide compliance report and the "who owns
      this" question during an incident (docs/runbooks/policy-violation-triage.md)
      are both useless if a workload can't be traced back to a name and a
      management path. This is the cheapest control in the whole library
      and the one most likely to matter at 2am.
    nearvic.io/compliance: "SOC 2 CC7.2 (asset inventory), NIST SSDF PO.3.1"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-ownership-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pods must carry both an app.kubernetes.io/name and an app.kubernetes.io/managed-by label."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/managed-by: "?*"
