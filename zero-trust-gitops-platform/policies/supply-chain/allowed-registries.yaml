apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allowed-registries
  annotations:
    policies.kyverno.io/title: Allowed Registries
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container and initContainer image must come from this
      project's own registry — either its ECR repository (the Terraform-
      provisioned production target, see infra/terraform/modules/ecr) or
      its GHCR namespace (what this specific deployment's CI actually
      pushes to, since no AWS account backs it — see docs/fidelity.md) —
      with two narrow, explicitly digest-pinned exceptions for the upstream
      tooling images gitops/apps/demo-api/base's PreSync verification hook
      and Phase 6's continuous-verification CronJob run (cosign, and a
      kubectl-capable image the CronJob pairs it with — see that CronJob's
      own comments for why two images are needed): neither runs this
      project's own application code, and each is pinned to one exact
      digest, rotated only by editing this policy alongside
      docs/versions.md. No Docker Hub image otherwise, no arbitrary
      third-party registry.
    nearvic.io/rationale: >-
      Signature verification only means something if the signer's identity
      also implies where the image lives. Allowing arbitrary registries
      would let an attacker who compromises any credential with cluster
      write access deploy an image from a registry this platform never
      pushes to or scans, sidestepping the ECR-side push/pull IAM scoping
      in infra/terraform/modules/ecr (or GHCR's equivalent package
      permissions) entirely.
    nearvic.io/compliance: "NIST SSDF PO.5.1, CIS EKS 5.4.1, SOC 2 CC6.1"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Images must come from this project's own ECR repository, its ghcr.io/beniaxcode/yahia-benabbou-portfolio namespace, or the one pinned cosign tooling image this policy explicitly allowlists."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: "*.dkr.ecr.*.amazonaws.com/zero-trust-gitops-platform/*"
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: "ghcr.io/beniaxcode/yahia-benabbou-portfolio/*"
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    # v2.6.5 — see docs/versions.md. Exact digest, not a tag:
                    # bumping this requires editing this policy on purpose.
                    value: "gcr.io/projectsigstore/cosign@sha256:ad281047f85c5e1fc6ffbc30c2b55be3b07b4032bef715a12122ce5829619aca"
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    # bitnami/kubectl:latest, pinned by digest — see
                    # docs/versions.md for why this tracks "latest" rather
                    # than a specific kubectl version tag.
                    value: "docker.io/bitnami/kubectl@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492"
