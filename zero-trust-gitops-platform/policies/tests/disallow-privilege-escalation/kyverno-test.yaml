apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-privilege-escalation-test
policies:
  - ../../workload-hardening/disallow-privilege-escalation.yaml
resources:
  - resource-pass.yaml
  - resource-fail.yaml
results:
  - policy: disallow-privilege-escalation
    rule: check-no-privilege-escalation
    resources:
      - compliant-pod
    kind: Pod
    result: pass
  - policy: disallow-privilege-escalation
    rule: check-no-privilege-escalation
    resources:
      - noncompliant-pod
    kind: Pod
    result: fail
