# Only the fail case is asserted here — see NOTES.md for why the pass
# case (a genuinely signed image) can't be verified without live
# Fulcio/Rekor/registry access, which this sandbox doesn't have.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-sbom-attestation-test
policies:
  - ../../supply-chain/verify-sbom-attestation.yaml
resources:
  - resource-fail.yaml
results:
  - policy: verify-sbom-attestation
    rule: verify-sbom
    resources:
      - noncompliant-pod
    kind: Pod
    result: fail
