apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-run-as-nonroot-test
policies:
  - ../../workload-hardening/require-run-as-nonroot.yaml
resources:
  - resource-pass.yaml
  - resource-fail.yaml
results:
  - policy: require-run-as-nonroot
    rule: check-runasnonroot
    resources:
      - compliant-pod
    kind: Pod
    result: pass
  - policy: require-run-as-nonroot
    rule: check-runasnonroot
    resources:
      - noncompliant-pod
    kind: Pod
    result: fail
