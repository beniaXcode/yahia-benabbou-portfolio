apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-ownership-labels-test
policies:
  - ../../governance/require-ownership-labels.yaml
resources:
  - resource-pass.yaml
  - resource-fail.yaml
results:
  - policy: require-ownership-labels
    rule: check-ownership-labels
    resources:
      - compliant-pod
    kind: Pod
    result: pass
  - policy: require-ownership-labels
    rule: check-ownership-labels
    resources:
      - noncompliant-pod
    kind: Pod
    result: fail
