apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readonly-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Workload Hardening
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must set securityContext.readOnlyRootFilesystem: true.
    nearvic.io/rationale: >-
      A writable root filesystem is what lets a compromised process drop a
      second-stage payload, patch a binary, or persist across a restart in
      the first place. demo-api's distroless runtime image has no shell to
      write with anyway; this makes that true for any workload, not just
      ones built distroless.
    nearvic.io/compliance: "CIS EKS 5.2.5, NIST SSDF PS.1.1"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-readonly-rootfs
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Every container must set securityContext.readOnlyRootFilesystem: true."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
