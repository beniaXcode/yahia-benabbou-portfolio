apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Workload Hardening
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must set cpu and memory requests and limits.
    nearvic.io/rationale: >-
      An unbounded container is a denial-of-service risk to every other
      workload on its node — one runaway or compromised process can
      starve everything sharing that node of CPU or memory. This is
      capacity hygiene as much as security, but the two overlap: a
      workload with no limits is also the workload most useful to an
      attacker running something resource-intensive (crypto-mining, a
      brute-force loop) without immediately standing out.
    nearvic.io/compliance: "CIS EKS 5.7.3, NIST SSDF PS.1.1"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Every container must set resources.requests and resources.limits for both cpu and memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
