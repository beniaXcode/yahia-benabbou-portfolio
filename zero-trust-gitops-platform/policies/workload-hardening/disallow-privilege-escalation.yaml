apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Workload Hardening
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must set securityContext.allowPrivilegeEscalation: false.
    nearvic.io/rationale: >-
      This is the setting that stops a container process from gaining
      more privileges than its parent had (via a setuid binary, for
      example) even if every other hardening control here is in place.
      Leaving it unset defaults to allowing escalation on most runtimes.
    nearvic.io/compliance: "CIS EKS 5.2.10, NIST SSDF PS.1.1"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-no-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Every container must set securityContext.allowPrivilegeEscalation: false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
