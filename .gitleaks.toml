title = "yahia-benabbou-portfolio gitleaks config"

[extend]
useDefault = true

# Constraint C1/C3 (see zero-trust-gitops-platform/CLAUDE.md): this repo must
# never contain a static AWS key or a private signing key. The default
# gitleaks ruleset already covers AKIA-style access keys and PEM/PKCS8
# private-key headers; the rules below add repo-specific belt-and-suspenders
# checks that are cheap false positives elsewhere but exactly right here.

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key", "AWS"]

[[rules]]
id = "aws-secret-access-key-assignment"
description = "AWS Secret Access Key assigned to a variable"
regex = '''(?i)(aws_secret_access_key|aws_secret_key)\s*[=:]\s*['"][A-Za-z0-9/+=]{40}['"]'''
tags = ["key", "AWS"]

[[rules]]
id = "cosign-private-key-file"
description = "A cosign private key must never be committed (keyless signing only, see ADR-0003)"
regex = '''-----BEGIN (ENCRYPTED SIGSTORE|EC|RSA|OPENSSH) PRIVATE KEY-----'''
tags = ["key", "sigstore"]

# Deliberately no custom rule here for "a workflow references secrets.X other
# than GITHUB_TOKEN": gitleaks is a literal-secret-*value* scanner, and its own
# default config (config/gitleaks.toml, loaded above via useDefault) globally
# allowlists the ${{ secrets.X }} / ${{ vars.X }} *expression syntax* itself as
# a template placeholder, for any X — by design, since referencing a secret by
# name is not the same as leaking its value. A custom rule targeting that
# syntax is therefore unconditionally suppressed by the extended default
# allowlist and can never fire (confirmed by testing). C1 (no GitHub Actions
# secret besides GITHUB_TOKEN) is a repo *policy* check, not a secret-value
# check, so it is enforced instead by tools/check-no-secrets.sh, wired into
# both pre-commit and .github/workflows/verify-no-secrets.yml.

[allowlist]
description = "known-safe patterns"
paths = [
  '''\.gitleaks\.toml''',
]
