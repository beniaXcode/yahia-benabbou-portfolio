# ArgoCD Application template — every one of the 30+ microservices gets one of these,
# generated from this shared shape rather than hand-authored per team.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-service-template
  namespace: argocd
  labels:
    platform: enterprise-cicd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/platform-deploy.git
    targetRevision: main
    path: deploy/{{ .ServiceName }}
  destination:
    server: https://kubernetes.default.svc
    namespace: "{{ .ServiceName }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
