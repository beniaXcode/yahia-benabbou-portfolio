# Representative Filebeat configuration — ships Kubernetes audit logs and application logs to
# the ELK stack, tagging security-relevant sources for separate alerting/dashboarding.

filebeat.inputs:
  - type: container
    paths:
      - /var/log/containers/*.log
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

  - type: log
    paths:
      - /var/log/kubernetes/audit/*.log
    fields:
      log_source: k8s-audit
      security_relevant: true
    fields_under_root: true

  - type: log
    paths:
      - /var/log/gatekeeper/*.log
    fields:
      log_source: admission-controller
      security_relevant: true
    fields_under_root: true

processors:
  - drop_fields:
      fields: ["agent.ephemeral_id", "ecs.version"]

output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOST}"]
  indices:
    - index: "security-logs-%{+yyyy.MM.dd}"
      when.equals:
        security_relevant: true
    - index: "app-logs-%{+yyyy.MM.dd}"
      when.not.equals:
        security_relevant: true
