# Build, test, then promote staging to production as a manual gate.

stages:
  - build
  - test
  - deploy-staging
  - promote-production

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

build:
  stage: build
  script:
    - docker build -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"

unit-tests:
  stage: test
  script:
    - npm ci
    - npm run test:unit

integration-tests:
  stage: test
  script:
    - npm ci
    - npm run test:integration

deploy-staging:
  stage: deploy-staging
  environment:
    name: staging
  script:
    - terraform -chdir=infra init
    - terraform -chdir=infra apply -auto-approve -var="environment=staging" -var="image_tag=$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

promote-production:
  stage: promote-production
  environment:
    name: production
  when: manual
  script:
    - terraform -chdir=infra init
    - terraform -chdir=infra apply -auto-approve -var="environment=production" -var="image_tag=$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
