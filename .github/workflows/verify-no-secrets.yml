name: Verify No Secrets

# Enforces C1 (zero GitHub Actions secrets besides GITHUB_TOKEN) and C3 (no
# private signing key ever committed) on every push and PR. Reuses the same
# tools/check-no-secrets.sh a contributor runs locally via pre-commit, so
# there's one implementation of this check, not two that can drift apart.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-no-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the secret guard (C1/C3)
        run: bash zero-trust-gitops-platform/tools/check-no-secrets.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: zero-trust-gitops-platform/apps/demo-api/go.mod

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gitleaks (full history scan)
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v

      - name: Fail if any secret other than GITHUB_TOKEN is referenced by any workflow
        run: |
          bad="$(grep -rhoE 'secrets\.[A-Za-z0-9_]+' .github/workflows/ | grep -vx 'secrets\.GITHUB_TOKEN' | sort -u || true)"
          if [ -n "$bad" ]; then
            echo "Found workflow(s) referencing a secret other than GITHUB_TOKEN:"
            echo "$bad"
            exit 1
          fi
          echo "OK: only GITHUB_TOKEN is referenced across .github/workflows/"

      - name: Fail if cosign.key or any other private key is tracked
        run: |
          tracked="$(git ls-files -- '*.key' '*.pem' '*.p12' '*.pfx' 'cosign.key' '*kubeconfig*' '.env' '.env.*' || true)"
          if [ -n "$tracked" ]; then
            echo "Forbidden files are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no private-key or credential files are tracked"
