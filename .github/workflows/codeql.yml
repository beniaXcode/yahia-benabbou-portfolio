name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "zero-trust-gitops-platform/apps/**"
  pull_request:
    branches: [main]
    paths:
      - "zero-trust-gitops-platform/apps/**"
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC — off the hour to avoid GitHub's scheduling pile-up
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        language: [go]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
